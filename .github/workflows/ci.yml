name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: make vet
      - name: unit tests
        run: make test
      - name: build each program on its own
        run: for p in $(ls apps); do (cd apps/$p && go build -o /dev/null .) || exit 1; done
      - name: build (all architectures)
        run: make cross
