# Deploy the locally built programs (make cross) to the switch VMs.
#   ansible-playbook deploy.yml -u root [-e switchd_args=--dry-run]
- hosts: switches
  become: false
  vars:
    switchd_args: --dry-run
    arch_map: {x86_64: amd64, aarch64: arm64, armv7l: arm}
    # Every program of the switch except swcli (make cross builds them).
    programs: "{{ lookup('ansible.builtin.fileglob', '../dist/*-linux-amd64', wantlist=True)
                  | map('basename') | map('regex_replace', '-linux-amd64$', '')
                  | reject('equalto', 'swcli') | list }}"
  tasks:
    - name: Install the programs (reference 1.9)
      ansible.builtin.copy:
        src: "../dist/{{ item }}-linux-{{ arch_map[ansible_architecture] }}"
        dest: "/usr/local/sbin/{{ item }}"
        mode: "0755"
      loop: "{{ programs }}"
      notify: restart switchd

    # Earlier versions linked swcli and cli to switchd: a copy onto the link
    # would overwrite switchd.
    - name: Earlier swcli link
      ansible.builtin.stat:
        path: /usr/local/bin/swcli
      register: swcli_link

    - name: Remove the earlier swcli link
      ansible.builtin.file:
        path: /usr/local/bin/swcli
        state: absent
      when: swcli_link.stat.islnk is defined and swcli_link.stat.islnk

    - name: Install swcli
      ansible.builtin.copy:
        src: "../dist/swcli-linux-{{ arch_map[ansible_architecture] }}"
        dest: /usr/local/bin/swcli
        mode: "0755"

    - name: cli is swcli
      ansible.builtin.file:
        src: swcli
        dest: /usr/local/bin/cli
        state: link
        force: true

    - name: Allow swcli as a login shell
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: /usr/local/bin/swcli

    - name: Daemon arguments
      ansible.builtin.copy:
        dest: /etc/default/switchd
        content: "SWITCHD_ARGS={{ switchd_args }}\n"
        mode: "0644"
      notify: restart switchd

    - name: systemd unit
      ansible.builtin.copy:
        src: ../packaging/switchd.service
        dest: /etc/systemd/system/switchd.service
        mode: "0644"
      notify: restart switchd

    - name: Enable and start
      ansible.builtin.systemd:
        name: switchd
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: restart switchd
      ansible.builtin.systemd:
        name: switchd
        state: restarted
        daemon_reload: true
