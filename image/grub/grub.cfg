# cerOS boot loader configuration (docs/os-image.md §4). The same for both
# slots; it lives on the ESP next to grubenv, the boot state.
#
# The first slot in ORDER with OK=1 and TRY=0 is booted; TRY=1 is saved
# before it starts. The running system sets TRY=0 once switchd runs. A slot
# that panics, hangs or loses power before that keeps TRY=1 and is skipped
# on the next boot.

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
set timeout=1
set timeout_style=menu

set envfile=${prefix}/grubenv
# The disk the boot loader came from: the slots are partitions 2 and 3.
regexp --set=1:disk '^([^,]+),' "$root"

set ORDER="A B"
set A_OK=1
set B_OK=1
set A_TRY=0
set B_TRY=0
if [ -f "$envfile" ]; then
  load_env --file "$envfile" ORDER A_OK A_TRY B_OK B_TRY A_ROOTHASH A_HASHOFFSET B_ROOTHASH B_HASHOFFSET A_VERSION B_VERSION
fi

set slot=""
for s in $ORDER; do
  if [ -z "$slot" ]; then
    if [ "$s" = A -a "$A_OK" = 1 -a "$A_TRY" = 0 ]; then set slot=A; set A_TRY=1; fi
    if [ "$s" = B -a "$B_OK" = 1 -a "$B_TRY" = 0 ]; then set slot=B; set B_TRY=1; fi
  fi
done
if [ -z "$slot" ]; then
  # Every good slot was tried: start over, so the switch always boots.
  set A_TRY=0
  set B_TRY=0
  for s in $ORDER; do
    if [ -z "$slot" ]; then
      if [ "$s" = A -a "$A_OK" = 1 ]; then set slot=A; set A_TRY=1; fi
      if [ "$s" = B -a "$B_OK" = 1 ]; then set slot=B; set B_TRY=1; fi
    fi
  done
fi
if [ -z "$slot" ]; then
  set slot=A
  set A_TRY=1
fi
if [ -f "$envfile" ]; then
  save_env --file "$envfile" A_TRY B_TRY
fi
set default="slot_$slot"
function slot_vars {
  if [ "$1" = A ]; then
    set part=gpt2
    set rh="$A_ROOTHASH"
    set ho="$A_HASHOFFSET"
  else
    set part=gpt3
    set rh="$B_ROOTHASH"
    set ho="$B_HASHOFFSET"
  fi
}

function boot_slot {
  set extra=""
  set s="$1"
  slot_vars $s
  # A slot GRUB cannot read (damaged file system, no kernel) is marked
  # failed and the other slot starts instead.
  if [ ! -f "($disk,$part)/boot/vmlinuz" ]; then
    echo "cerOS: slot $s cannot be read; starting the other slot"
    if [ "$s" = A ]; then set A_OK=0; set s=B; else set B_OK=0; set s=A; fi
    if [ -f "$envfile" ]; then save_env --file "$envfile" A_OK B_OK; fi
    slot_vars $s
  fi
  probe --set=puuid --part-uuid "($disk,$part)"
  set root="($disk,$part)"
  echo "cerOS: slot $s"
  linux /boot/vmlinuz root=/dev/mapper/root rootfstype=squashfs ro ceros.slot=$s ceros.part=$puuid ceros.roothash=$rh ceros.hashoffset=$ho console=tty0 console=ttyS0,115200 panic=5 oops=panic rd.shell=0 rd.emergency=reboot quiet $extra
  initrd /boot/initrd.img
}

menuentry "cerOS $A_VERSION (slot A)" --id slot_A {
  boot_slot A
}
menuentry "cerOS $B_VERSION (slot B)" --id slot_B {
  boot_slot B
}
